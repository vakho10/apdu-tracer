appId: com.vakho.apdu-tracer
productName: APDU Tracer
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target: nsis
  icon: build/icon.png
nsis:
  # Dash-cased installer name; the default uses "APDU Tracer Setup …", whose
  # spaces GitHub rewrites to dots on the release asset.
  artifactName: APDU-Tracer-Setup-${version}.${ext}

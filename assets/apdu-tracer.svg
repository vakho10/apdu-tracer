<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">APDU Tracer</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe594"/>
      <stop offset="0.45" stop-color="#e6b84a"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Contact plate -->
  <rect x="24" y="40" width="208" height="176" rx="30" fill="url(#gold)" stroke="#7a5a12" stroke-width="6"/>
  <rect x="32" y="46" width="192" height="64" rx="24" fill="url(#shine)"/>

  <!-- Contact separations: four pads per side around the central island -->
  <g fill="none" stroke="#7a5a12" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="92" y="70" width="72" height="116" rx="10"/>
    <path d="M27 84H92M27 172H92M164 84H229M164 172H229"/>
    <path d="M128 43V70M128 186V213"/>
    <!-- The middle contacts carry a pulse through the chip: the traced APDU. -->
    <path d="M27 128H102L110 128L117 108L126 150L135 100L143 146L150 128L154 128H229"/>
  </g>
</svg>

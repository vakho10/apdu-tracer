name: C++ / Qt

on:
  push:
    branches: [main, 'codex/native-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build/windows --config Release --parallel
      - name: Test decoder and Qt replay
        run: ctest --test-dir build/windows -C Release --output-on-failure

  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/core -DAPDU_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/core --parallel
      - name: Test decoder
        run: ctest --test-dir build/core --output-on-failure

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git-cliff can build the notes

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Typecheck
        run: npm run typecheck

      # build:win runs electron-builder with --publish never; the release is
      # uploaded by the dedicated step below so assets aren't published twice.
      - name: Build Windows installer
        run: npm run build:win

      # Generate the notes for this tag from the commit history (see cliff.toml).
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: APDU Tracer ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
